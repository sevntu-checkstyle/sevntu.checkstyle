name: "checks"

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  no-exception:
    strategy:
      fail-fast: false
      matrix:
        profile:
          - checkstyle
          - struts
          - guava
          - hibernate-orm
          - spotbugs
          - spring-framework
          - hbase
          - pmd-elasticsearch-lombok-ast
          - alot-of-projects

    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v1
        with:
          java-version: 21

      - name: Install Groovy
        run: |
          curl --fail-with-body -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install groovy
          echo "$HOME/.sdkman/candidates/groovy/current/bin" >> "$GITHUB_PATH"
          groovy --version

      - name: Checkout
        uses: actions/checkout@v2

      - name: Checks Setup
        run: ./.ci/checks-no-exception.sh setup

      - name: Execute
        run: ./.ci/checks-no-exception.sh ${{ matrix.profile }}
